# nbio's original CI, adapted to arco-nbio (Go 1.27.3, branch arco).
# Linux tests, -race and fuzzing are in arco-tls.yml (tools/tlssync/check.sh on amd64 and arm64), so
# this workflow keeps only what that one does not cover: lint, macOS/Windows tests, Autobahn and CodeQL.
name: CI

on:
  push:
    branches: [arco]
    tags: [v*]
  pull_request:
    branches: [arco]
  schedule:
    - cron: "41 10 * * 3"

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Built from source with the go.mod toolchain: a prebuilt golangci-lint refuses a newer target
      # Go version than the one it was built with. Config in .golangci.yml.
      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.15.0
          install-mode: goinstall

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        shell: bash
        run: |
          [ "$RUNNER_OS" = "Windows" ] || ulimit -n 30000
          go test -count=1 -timeout 10m ./...

  autobahn:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: autobahn test
        run: bash ./autobahn/script/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobahn-report
          path: autobahn/report
          retention-days: 7

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
